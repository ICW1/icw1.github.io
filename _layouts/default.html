<!DOCTYPE html>
<html lang="en">

<head>
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% if page.excerpt %}
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}" />
  <meta property="og:description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}" />
  {% else %}
  <meta name="description" content="{{ site.description }}" />
  <meta property="og:description" content="{{ site.description }}" />
  {% endif %}
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}" />
  <meta property="og:image" content="{{ site.avatar }}" />
  <meta name="theme-color" content="#0c0a09" />
  <link rel="icon" href="https://avatars.githubusercontent.com/u/52133502?s=64&v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css" />
  <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml" />
</head>

<body>
  <main class="site">
    <div class="page">
      <nav class="page-nav">
        <a href="{{ site.baseurl }}/">&larr; Home</a>
        <a href="{{ site.baseurl }}/blog/">Blog</a>
      </nav>

      {{ content }}
    </div>

    <footer class="site-footer">
      &copy; <span id="year"></span> Ian Crowe-Wright. All rights reserved.
    </footer>
  </main>

  <script src="{{ site.baseurl }}/assets/js/main.js"></script>
</body>

</html>
